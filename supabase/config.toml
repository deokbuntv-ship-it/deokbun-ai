# Supabase project configuration (minimal — Edge Functions only).
#
# This declares the `chat` Edge Function with platform JWT verification enabled,
# so only authenticated users can invoke it.
#
# If you prefer the full CLI-generated config, delete this file first and run
# `supabase init`, then re-add the [functions.chat] block below.

project_id = "olvkpaldrwvtexxpoaag"

[functions.chat]
enabled = true
verify_jwt = true

# CONTENT-02: admin-gated AI text generation. Platform JWT verification rejects
# unauthenticated callers; the handler additionally requires admin_users
# membership (server-side) before generating. Reuses the OPENAI_API_KEY secret.
[functions.content-generate]
enabled = true
verify_jwt = true

# P0-6: admin-gated Famous profile/SEO AI suggestions (PREMIUM_CONTENT). Same
# security model as content-generate; proposes fields (never auto-applies/publishes).
[functions.famous-suggest]
enabled = true
verify_jwt = true

# IMAGE_STANDARD: admin-gated image generation (OpenAI/LOW, resolved server-side).
# Downloads + persists to Supabase Storage before marking success. Reuses OPENAI_API_KEY.
[functions.media-generate]
enabled = true
verify_jwt = true

# VIDEO_STANDARD: admin-gated async video generation (Google Veo, resolved
# server-side). video-generate starts the long-running op; video-status polls +
# persists to Storage. Needs GEMINI_API_KEY (server secret; USER ACTION).
[functions.video-generate]
enabled = true
verify_jwt = true

[functions.video-status]
enabled = true
verify_jwt = true

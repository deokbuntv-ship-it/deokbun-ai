# Supabase project configuration (minimal — Edge Functions only).
#
# This declares the `chat` Edge Function with platform JWT verification enabled,
# so only authenticated users can invoke it.
#
# If you prefer the full CLI-generated config, delete this file first and run
# `supabase init`, then re-add the [functions.chat] block below.

project_id = "olvkpaldrwvtexxpoaag"

[functions.chat]
enabled = true
verify_jwt = true

# CONTENT-02: admin-gated AI text generation. Platform JWT verification rejects
# unauthenticated callers; the handler additionally requires admin_users
# membership (server-side) before generating. Reuses the OPENAI_API_KEY secret.
[functions.content-generate]
enabled = true
verify_jwt = true

# P0-6: admin-gated Famous profile/SEO AI suggestions (PREMIUM_CONTENT). Same
# security model as content-generate; proposes fields (never auto-applies/publishes).
[functions.famous-suggest]
enabled = true
verify_jwt = true

# IMAGE_STANDARD: admin-gated image generation (OpenAI/LOW, resolved server-side).
# Downloads + persists to Supabase Storage before marking success. Reuses OPENAI_API_KEY.
[functions.media-generate]
enabled = true
verify_jwt = true

# VIDEO_STANDARD: admin-gated async video generation (Google Veo, resolved
# server-side). video-generate starts the long-running op; video-status polls +
# persists to Storage. Needs GEMINI_API_KEY (server secret; USER ACTION).
[functions.video-generate]
enabled = true
verify_jwt = true

[functions.video-status]
enabled = true
verify_jwt = true

# NAVER LOGIN bridge (PATH B). Naver is not a Supabase provider, so this trusted
# function does the Naver code exchange + Supabase session mint. It runs BEFORE the
# user has a Supabase session, so JWT verification MUST be off (its trust is the
# Naver code exchange + state, not a Supabase JWT). Needs NAVER_CLIENT_ID /
# NAVER_CLIENT_SECRET as Edge secrets (USER ACTION). Never logs code/tokens.
[functions.naver-auth]
enabled = true
verify_jwt = false

[functions.ad-track]
enabled = true
verify_jwt = false

# IAP purchase verification (Sprint I). Authenticated user submits an OPAQUE store token; the server verifies
# it with the store and grants Duk. JWT ON — only an authenticated user may request verification.
[functions.verify-purchase]
enabled = true
verify_jwt = true

# App Store Server Notifications V2 webhook. Apple posts a signed JWS with NO Supabase JWT, so platform JWT
# verification MUST be off — but the function still verifies the Apple JWS signature before ANY effect (its
# trust is the Apple signature, not a Supabase JWT). Never mutates entitlements from unverified JSON.
[functions.apple-notifications-v2]
enabled = true
verify_jwt = false

# Google Play RTDN webhook. Pub/Sub posts an OIDC token (not a Supabase JWT), so platform JWT verification MUST
# be off — the function authenticates the push + re-fetches authoritative Play state before any effect. The RTDN
# body is only a change signal, never the purchase truth.
[functions.google-rtdn]
enabled = true
verify_jwt = false

# Retention worker seams (Sprint J6). Cron-triggered; NOT consumer JWT — each authenticates via the CRON_SECRET
# header and fails closed without it (verify_jwt = false because the platform JWT check does not apply to cron).
# Not deployed by this batch (owner deploys). See docs/RETENTION_WORKERS_RUNBOOK.md for scheduling.
[functions.run-scheduled-notifications]
enabled = true
verify_jwt = false

[functions.run-email-campaigns]
enabled = true
verify_jwt = false

[functions.retry-notification-deliveries]
enabled = true
verify_jwt = false

[functions.retry-email-deliveries]
enabled = true
verify_jwt = false
